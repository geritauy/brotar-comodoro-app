<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9fdcd8">
<meta name="description" content="Brotar: cultivá tu bosque mientras estudiás, con sesiones de foco y descansos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brotar">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Brotar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --savia:#26824d; --brote:#b9e26b; --tinta:#173a33; --sol:#f4b942; --agua:#3c93b8;
  --linea:rgba(23,58,51,.12); --muted:rgba(23,58,51,.62);
  --on-sky:#173a33; --sky-top:#9fdcd8; --sky-bot:#eef9d9;
}
body.sky-sunset{--sky-top:#6d5a9c;--sky-bot:#f8b57a;--on-sky:#ffffff}
body.sky-night{--sky-top:#0d2142;--sky-bot:#35637a;--on-sky:#ffffff}
body.sky-space{--sky-top:#080b2b;--sky-bot:#34205f;--on-sky:#ffffff}

#stage{isolation:isolate}
#skyArt{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .5s ease}
#gl{z-index:1}
body.sky-sunset #skyArt,body.sky-night #skyArt,body.sky-space #skyArt{opacity:1}
body.sky-sunset{--sky-top:#473d78;--sky-bot:#f5a36f;--on-sky:#fff}
body.sky-night{--sky-top:#07152f;--sky-bot:#183b61;--on-sky:#fff}
body.sky-space{--sky-top:#080b2b;--sky-bot:#34205f;--on-sky:#fff}
body.sky-sunset #skyArt{
  background:
    radial-gradient(ellipse at 50% 72%,rgba(255,226,165,.5) 0,rgba(255,178,119,.22) 20%,transparent 48%),
    linear-gradient(180deg,#473d78 0%,#82608e 43%,#e88d83 72%,#f5b477 100%);
}
body.sky-sunset #skyArt:before{
  content:"";position:absolute;width:clamp(100px,28vw,170px);height:clamp(100px,28vw,170px);
  left:50%;top:31%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fff2c1 0,#ffd18a 42%,#ff9d72 75%,rgba(255,157,114,.1) 100%);
  box-shadow:0 0 38px 14px rgba(255,190,130,.28),0 0 100px 36px rgba(255,146,119,.18);
}
body.sky-sunset #skyArt:after{
  content:"";position:absolute;left:-15%;right:-15%;bottom:0;height:35%;
  background:linear-gradient(180deg,transparent,rgba(255,191,137,.16));
}
body.sky-night #skyArt,body.sky-space #skyArt{
  background:
    radial-gradient(1.5px 1.5px at 8% 16%,#fff 98%,transparent),
    radial-gradient(1px 1px at 18% 32%,#dcecff 98%,transparent),
    radial-gradient(2px 2px at 28% 12%,#fff 98%,transparent),
    radial-gradient(1px 1px at 39% 24%,#fff 98%,transparent),
    radial-gradient(1.5px 1.5px at 51% 11%,#dcecff 98%,transparent),
    radial-gradient(1px 1px at 63% 29%,#fff 98%,transparent),
    radial-gradient(2px 2px at 74% 14%,#fff 98%,transparent),
    radial-gradient(1px 1px at 86% 27%,#dcecff 98%,transparent),
    radial-gradient(1px 1px at 94% 10%,#fff 98%,transparent),
    radial-gradient(1.5px 1.5px at 13% 48%,#fff 98%,transparent),
    radial-gradient(1px 1px at 33% 43%,#dcecff 98%,transparent),
    radial-gradient(1.5px 1.5px at 57% 48%,#fff 98%,transparent),
    radial-gradient(1px 1px at 78% 43%,#fff 98%,transparent),
    linear-gradient(180deg,var(--sky-top),var(--sky-bot));
  background-size:100% 100%;
}
body.sky-night #skyArt:before{
  content:"";position:absolute;width:66px;height:66px;right:13%;top:16%;border-radius:50%;
  background:#f5f0d8;box-shadow:0 0 24px 8px rgba(221,232,255,.17);
}
body.sky-night #skyArt:after{
  content:"";position:absolute;width:66px;height:66px;right:calc(13% - 20px);top:10%;
  border-radius:50%;background:#0b1b37;
}
body.sky-space #skyArt:before{
  content:"";position:absolute;width:190px;height:190px;right:-55px;top:12%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(173,147,255,.34),rgba(112,83,205,.12) 55%,transparent 72%);
  box-shadow:0 0 65px rgba(148,116,255,.2);
}
@keyframes skyTwinkle{0%,100%{opacity:.55}50%{opacity:1}}
body.sky-night #skyArt,body.sky-space #skyArt{animation:skyTwinkle 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){#skyArt{transition:none;animation:none!important}}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 100%);
  color:var(--tinta);font:500 15px/1.35 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.display{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:grid;grid-template-rows:minmax(0,1fr) auto auto auto}
#stage{position:relative;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.top{position:absolute;top:max(env(safe-area-inset-top),12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.brand{display:flex;align-items:center;gap:7px;font:800 24px "Bricolage Grotesque","Trebuchet MS",sans-serif;letter-spacing:-.02em;color:var(--on-sky)}
.top-r{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:#fff;color:var(--tinta);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;font-size:16px;box-shadow:0 2px 10px rgba(23,58,51,.18)}
.chip.pop{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.14)}}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe597,#f4b942 60%,#d8942a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);flex:none}
.round{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--tinta);display:grid;place-items:center;box-shadow:0 2px 10px rgba(23,58,51,.18)}
.treelabel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;white-space:nowrap;z-index:2}
#toasts{position:absolute;top:64px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.toast{background:var(--tinta);color:#fff;padding:9px 15px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--on-sky);font-weight:600}

#sheet{background:rgba(255,255,255,.96);border-radius:28px 28px 0 0;padding:18px 18px 10px;box-shadow:0 -10px 40px rgba(23,58,51,.14);position:relative;z-index:5}
#sheet.scroll{max-height:50vh;max-height:50dvh;overflow:auto;overscroll-behavior:contain}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
h2{margin:0;font:800 21px "Bricolage Grotesque","Trebuchet MS",sans-serif;letter-spacing:-.01em}
h3{margin:16px 0 2px;font:700 15px Figtree,sans-serif}
.muted{color:var(--muted);font-size:13px}
.lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:5px}
.lbl b{color:var(--tinta)}

.foco{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:rgba(23,58,51,.09)}
.ring .prog{stroke:var(--savia);stroke-linecap:round;transition:stroke-dashoffset .35s linear}
.ring.break .prog{stroke:var(--agua)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.digits{font:800 30px "Bricolage Grotesque","Trebuchet MS",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mlabel{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center;padding:0 12px;line-height:1.2}
.ctrl{display:grid;gap:11px;min-width:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--linea);background:#fff;font-size:19px;color:var(--tinta);line-height:1}
.step input{width:56px;height:36px;text-align:center;font:700 18px Figtree,sans-serif;border:1.5px solid var(--linea);border-radius:12px;color:var(--tinta);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px}
.chip2{padding:5px 13px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;font-weight:700;color:var(--tinta);font-size:13.5px}
.chip2.on{background:var(--savia);border-color:var(--savia);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(23,58,51,.11)}
.dots i.on{background:var(--savia)}
.dots i.cur{background:var(--savia);opacity:var(--f,.3)}
.room{margin:0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:#34c36a;flex:none;box-shadow:0 0 0 3px rgba(52,195,106,.2)}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{height:50px;border-radius:16px;border:0;font:700 16px Figtree,sans-serif;padding:0 20px}
.btn.primary{background:var(--savia);color:#fff;flex:1}
.btn.ghost{background:rgba(23,58,51,.07);color:var(--tinta)}
.btn.block{width:100%}
.btn.sm{height:36px;border-radius:12px;font-size:14px;padding:0 14px;background:var(--tinta);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.sm.ghost{background:rgba(23,58,51,.08);color:var(--tinta)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.flex1{flex:1}

#nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);position:relative;z-index:6}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
#nav .ic{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
#nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--savia);font-weight:700}
#nav button.on .ic{background:rgba(38,130,77,.13)}

.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--linea)}
.row:first-of-type{border-top:0}
.row b{font-weight:700}
.row .end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tag{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;background:rgba(38,130,77,.13);color:var(--savia);white-space:nowrap}
.tag.lock{background:rgba(23,58,51,.08);color:var(--muted)}
.banner{background:rgba(185,226,107,.35);border-radius:16px;padding:11px 13px;margin:8px 0 2px;font-size:13.5px}
.bar{height:8px;border-radius:99px;background:rgba(23,58,51,.1);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--savia);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{display:flex;flex-direction:column}
.stats b{font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.stats span{font-size:12.5px;color:var(--muted)}
.mini{height:6px;margin-top:5px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 17px "Bricolage Grotesque",sans-serif}
.rk{display:none}
.row.f{grid-template-columns:22px 40px 1fr auto}
.row.f .rk{display:block;color:var(--muted);font-weight:700;text-align:center}
.st{font-size:12.5px;color:var(--muted)}
.st.focus{color:var(--savia);font-weight:700}
.heart{border:0;background:rgba(23,58,51,.07);color:var(--muted);width:34px;height:30px;border-radius:10px;font-size:16px}
.heart.on{background:#ffe3ea;color:#e0426b}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(23,58,51,.05);border-radius:16px;padding:10px 12px 10px 16px;margin:8px 0}
.code b{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:.04em}
.addf{display:flex;gap:8px;margin-top:10px}
.addf input{flex:1;min-width:0;height:40px;border-radius:12px;border:1.5px solid var(--linea);padding:0 12px;font:600 15px Figtree,sans-serif;color:var(--tinta)}
.foot{font-size:12px;color:var(--muted);margin:10px 0 4px}
.toolcard{background:rgba(38,130,77,.06);border:1px solid var(--linea);border-radius:16px;padding:12px;margin:10px 0}
.toolcard input,.toolcard textarea{width:100%;border:1.5px solid var(--linea);border-radius:11px;padding:10px;font:600 14px Figtree,sans-serif;color:var(--tinta);background:#fff}
.toolcard textarea{min-height:82px;resize:vertical}
.toolstat{background:rgba(23,58,51,.05);border-radius:13px;padding:10px}
.toolstat b{display:block;font:800 20px "Bricolage Grotesque",sans-serif}

#modal{position:fixed;inset:0;background:rgba(23,58,51,.5);display:grid;place-items:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
#modal .card{background:#fff;border-radius:26px;padding:22px;width:min(100%,390px);max-height:88vh;overflow:auto}
.big{font:800 56px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;line-height:1;margin:8px 0 2px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.sw input[type=checkbox]{width:24px;height:24px;accent-color:var(--savia)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* PWA: pantalla de inicio, instalación y zonas seguras */
#bootSplash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 42%,#fff8dc 0,#f4f0d9 48%,#e7f1d9 100%);transition:opacity .45s ease,visibility .45s ease}
#bootSplash img{width:116px;height:116px;object-fit:cover;border-radius:28px;box-shadow:0 12px 32px rgba(37,88,51,.15)}
.boot-title{font:800 34px 'Bricolage Grotesque',system-ui,sans-serif;color:#245d3d;letter-spacing:-1.2px}
.boot-sub{font:600 13px 'Figtree',system-ui,sans-serif;color:#637b62}
.boot-track{width:112px;height:4px;border-radius:9px;background:#dce8d3;overflow:hidden;margin-top:12px}
.boot-track i{display:block;width:42%;height:100%;border-radius:9px;background:#65a65e;animation:bootmove 1.1s ease-in-out infinite alternate}
@keyframes bootmove{to{transform:translateX(140%)}}
#bootSplash.done{opacity:0;visibility:hidden;pointer-events:none}
.offline-badge{display:none;border-radius:999px;padding:6px 9px;background:#fff0d8;color:#8b5b1b;font:700 11px 'Figtree',system-ui,sans-serif;white-space:nowrap}
.offline-badge.visible{display:inline-flex}
.install-chip{display:none;border:0;border-radius:999px;padding:8px 11px;background:#e8f3df;color:#28613d;font:700 12px 'Figtree',system-ui,sans-serif;white-space:nowrap;cursor:pointer}
.install-chip.visible{display:inline-flex;align-items:center}
@media(max-width:380px){.install-chip{padding:7px 8px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.boot-track i{animation:none}}

#brandCredit{background:#fff;text-align:center;padding:2px 8px 5px;color:#b8c2bd;font-size:10px;letter-spacing:.025em;line-height:1.2}

.friend-coming{margin:14px 0 5px;padding:20px 16px 18px;border:1px solid rgba(38,130,77,.12);border-radius:22px;background:linear-gradient(155deg,#f7fbf2,#eef7ed);text-align:center;}
.friend-illustration{height:88px;width:88px;margin:0 auto 10px;border-radius:28px;background:linear-gradient(145deg,#e2f1d8,#cde8c4);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px rgba(38,130,77,.08)}
.friend-illustration span{font-size:43px;filter:drop-shadow(0 3px 2px rgba(23,58,51,.12))}.friend-illustration i{position:absolute;right:8px;top:9px;color:#d7a83b;font-style:normal}.friend-illustration b{position:absolute;left:9px;bottom:8px;color:#72a86c;font-size:17px}
.friend-pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#e1efda;color:#477c4b;font-size:10px;font-weight:800;letter-spacing:.09em}
.friend-coming h3{font-size:17px;line-height:1.25;margin:12px auto 7px;max-width:270px;color:var(--tinta)}
.friend-coming p{margin:0 auto;color:#71847a;font-size:13px;line-height:1.5;max-width:310px}
.friend-features{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:17px;padding-top:14px;border-top:1px solid rgba(38,130,77,.12)}
.friend-features div{display:flex;flex-direction:column;align-items:center;gap:5px;color:#6c8274;font-size:10px}.friend-features span{font-size:18px}.friend-features b{font-weight:700}

/* Cuenta, sincronización y comunidad real */
.cloud-card{background:#f6faf3;border:1px solid rgba(38,130,77,.13);border-radius:18px;padding:14px;margin:12px 0}
.cloud-card input[type=email],.cloud-card input[type=password],.cloud-card input[type=text]{width:100%;height:42px;border:1.5px solid var(--linea);border-radius:12px;padding:0 12px;margin:5px 0 9px;font:600 14px Figtree,sans-serif;color:var(--tinta);background:#fff}
.cloud-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cloud-actions .btn{min-height:40px;height:auto;padding:9px 13px;font-size:13px}
.cloud-status{font-size:11px;color:#66806d;font-weight:700}
.friend-cloud-row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--linea)}
.friend-cloud-row:first-child{border-top:0}
.friend-cloud-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dcefd5;color:#36724a;font-weight:800}
.cloud-check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted);margin:12px 0}
.cloud-check input{width:18px;height:18px;accent-color:var(--savia);flex:none}
.invite-box{overflow-wrap:anywhere;background:#fff;border:1px dashed rgba(38,130,77,.35);border-radius:12px;padding:10px;font-size:12px;color:var(--muted);margin:9px 0}

</style>
</head>
<body class="sky-day">
<div id="bootSplash" role="status" aria-label="Cargando Brotar">
  <img src="icons/icon-192.png" alt="" width="104" height="104">
  <div class="boot-title">Brotar</div>
  <div class="boot-sub">Cada sesión hace crecer tu bosque</div>
  <div class="boot-track"><i></i></div>
</div>
<div id="app">
  <div id="stage">
    <div id="skyArt" aria-hidden="true"></div>
    <canvas id="gl" aria-label="Tu árbol en 3D. Arrastrá para girarlo"></canvas>
    <div class="top">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 10 10 4 21 3c0 10-5 16-14 16z" fill="#26824d"/><path d="M4 20C8 14 11 11 15 8" stroke="#b9e26b" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        Brotar
      </div>
      <div class="top-r">
        <span id="offlineBadge" class="offline-badge" aria-live="polite">Sin conexión</span>
        <button class="install-chip" id="installBtn" type="button" aria-label="Instalar Brotar">＋ Instalar</button>
        <button class="chip" id="ptsBtn" data-act="goTienda" aria-label="Tus puntos. Abrir tienda"><span class="coin"></span><span id="pts">0</span></button>
        <button class="round" data-act="cfg" aria-label="Ajustes">

  const blob=T.sp.shape!=='cone';

    m.position.set(s.x*cs+sw,cy+s.y*cs,s.z*cs+sw*.6);

function updateTimerUI(){
  const dg=$('#digits');if(!dg)return;
  const tr=S.trees[S.active];
  let remain,fracDone=0,label;
  if(session){
    const el=elapsed(session);remain=session.durMs-el;fracDone=clamp(el/session.durMs,0,1);
    label=session.mode==='break'?'Descanso':(session.resumedAt?'Enfocándote':'En pausa');
  }else{remain=S.dur*60000;label='Listo para brotar'}
  dg.textContent=fmtClock(remain);
  $('#mlabel').textContent=label;
  $('#ringP').style.strokeDashoffset=339.3*(1-fracDone);
  document.title=session?fmtClock(remain)+' · Brotar':'Brotar';
  const dots=$('#dots');
  if(dots){
    const f=session&&session.mode==='focus'&&session.resumedAt?clamp(elapsed(session)/60000-session.awarded,0,1):0;
    [...dots.children].forEach((d,i)=>{d.className=i<tr.partial?'on':(i===tr.partial?'cur':'');if(i===tr.partial)d.style.setProperty('--f',(.25+.75*f).toFixed(2))});
    $('#leafTxt').textContent=tr.partial+'/'+LEAF_MIN+' min';
  }
  const room=$('#room');
  if(room){
    const names=S.friends.filter(f=>f.st==='focus').map(f=>f.n);
    room.innerHTML=names.length?`<span class="live"></span><span>${names.length>1?names.slice(0,-1).join(', ')+' y '+names.slice(-1):names[0]} ${names.length>1?'están':'está'} estudiando ahora${session?'':'. Sumate.'}</span>`:'';
  }
}

function renderBosque(){

  h+=`<h3>Árboles</h3>`;

    const tr=S.trees[id],st=stageOf(tr.leaves);

function renderTienda(){
  const sec=(title,type)=>`<h3>${title}</h3>`+ITEMS.filter(i=>i.type===type).map(rowShop).join('');

    const owned=isOwned(it),can=S.points>=it.cost,req=itemUnlockState(it),locked=!req.unlocked;
    let btn='',sub=it.desc;

      if(it.type==='tree')btn=S.active===it.id?'<span class="tag">Cuidando</span>':`<button class="btn sm" data-act="care" data-id="${it.id}">Cuidar</button>`;

  <div class="sw"><div><b>Pausa</b><div class="muted">Duración del descanso</div></div><div class="step"><button data-act="brk-" aria-label="Menos pausa">−</button><b id="brkV" style="min-width:48px;text-align:center">${S.brk} min</b><button data-act="brk+" aria-label="Más pausa">+</button></div></div>
  <div class="sw"><div><b>Modo demostración</b><div class="muted">1 minuto dura 1 segundo. Se aplica a la próxima sesión.</div></div><input type="checkbox" id="demoCb" ${S.demo?'checked':''} aria-label="Modo demostración"></div>
  <div class="sw"><div><b>Música ambiental relajante</b><div class="muted">Sonido suave generado por Brotar. Opcional.</div></div><input type="checkbox" id="musicCb" ${S.music?'checked':''} aria-label="Música ambiental"></div>
  <h3>Para probar</h3>
  <div class="actions" style="margin-top:8px"><button class="btn sm ghost flex1" data-act="demoPoints">+100 puntos</button><button class="btn sm ghost flex1" data-act="demoLeaves">+10 hojas</button></div>
  <div class="actions"><button class="btn ghost flex1" data-act="reset">Borrar mi progreso</button><button class="btn primary flex1" data-act="closeModal">Listo</button></div>`);
}

/* ---------- acciones ---------- */
function setDur(v){S.dur=Math.round(clamp(Number(v)||25,1,180));save();renderFoco()}
function act(a,el){
  switch(a){
    case 'authSignup':authSignup();break;
    case 'authLogin':authLogin();break;
    case 'authLogout':supabaseClient.auth.signOut().then(()=>{cloudUser=null;cloudFriends=[];renderAmigos();toast('Sesión cerrada')});break;
    case 'createInvite':createFriendInvite();break;
    case 'acceptInvite':acceptFriendInvite();break;
    case 'refreshFriends':loadCloudFriends();break;
    case 'removeFriend':removeCloudFriend(el.dataset.id);break;
    case 'saveShare':saveSharePreference();break;
    case 'tab':tab=el.dataset.tab;renderTab();break;
    case 'addSubject':{const v=($('#newSubject').value||'').trim();if(!v){toast('Escribí un nombre');break}if(S.subjects.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Esa materia ya existe');break}S.subjects.push(v);S.selectedSubject=v;save();renderTab();break}
    case 'renameSubject':{const i=+el.dataset.id,old=S.subjects[i],v=prompt('Nuevo nombre para '+old,old);if(v&&v.trim()){const n=v.trim().slice(0,32);S.subjects[i]=n;S.studyLog.forEach(x=>{if(x.subject===old)x.subject=n});if(S.selectedSubject===old)S.selectedSubject=n;save();renderTab()}break}
    case 'delSubject':{const i=+el.dataset.id,old=S.subjects[i];if(!confirm('¿Quitar '+old+' de la lista? El historial se conserva.'))break;S.subjects.splice(i,1);if(S.selectedSubject===old)S.selectedSubject='';save();renderTab();break}
    case 'saveNotes':S.notes=$('#notesArea').value;save();toast('Apuntes guardados');break;
    case 'addTask':{const v=($('#newTask').value||'').trim();if(v){S.tasks.push({text:v,done:false});save();renderTab()}break}
    case 'delTask':S.tasks.splice(+el.dataset.id,1);save();renderTab();break;
    case 'addCard':{const q=($('#cardQ').value||'').trim(),a=($('#cardA').value||'').trim();if(q&&a){S.cards.push({q,a});save();renderTab()}else toast('Completá pregunta y respuesta');break}
    case 'delCard':S.cards.splice(+el.dataset.id,1);save();renderTab();break;
    case 'showCard':{const a=$('#answer'+el.dataset.id);if(a)a.hidden=!a.hidden;break}
    case 'goTienda':tab='tienda';renderTab();break;
    case 'start':startFocus();break;
    case 'pause':{const s=session;if(!s)break;if(s.resumedAt){s.base=elapsed(s);s.resumedAt=null;unlock()}else{s.resumedAt=Date.now();lock()}save();renderFoco();break}
    case 'stop':stopSession();break;
    case 'break':startBreak();break;
    case 'closeModal':closeModal();break;
    case 'dur-':setDur(S.dur-5);break;
    case 'dur+':setDur(S.dur+5);break;
    case 'dur':setDur(el.dataset.v);break;
    case 'cfg':openSettings();break;
    case 'brk-':S.brk=clamp(S.brk-1,1,30);save();$('#brkV').textContent=S.brk+' min';break;
    case 'brk+':S.brk=clamp(S.brk+1,1,30);save();$('#brkV').textContent=S.brk+' min';break;
    case 'demoPoints':S.points+=100;save();$('#pts').textContent=S.points;popPoints();toast('Sumaste 100 puntos de prueba');if(tab!=='foco')renderTab();break;
    case 'demoLeaves':{const tr=S.trees[S.active];tr.leaves+=10;save();buildTree(S.active);toast('Sumaste 10 hojas a tu '+SPECIES[S.active].name);if(tab!=='foco')renderTab();break}
    case 'reset':
      if(!el.dataset.arm){el.dataset.arm=1;el.textContent='Tocá otra vez para borrar';break}
      session=null;unlock();S=defaultState();S.friends.forEach(f=>f.since=Date.now()-(f.off||0)*60000);save();closeModal();buildTree('roble');applyEquipment();updateLabel();$('#pts').textContent=0;tab='foco';renderTab();toast('Empezaste de cero');break;
    case 'buy':{
      const it=ITEMS.find(i=>i.id===el.dataset.id);if(!it||S.points<it.cost||isOwned(it)||!itemUnlockState(it).unlocked)break;
      S.points-=it.cost;
      if(it.type==='tree'){S.trees[it.id]={leaves:0,partial:0}}
      else{S.owned[it.id]=true;if(it.type==='sky')S.sky=skyKey(it.id);else S.equipped[it.id]=true}
      save();applyEquipment();$('#pts').textContent=S.points;toast('Conseguiste: '+nameOf(it));renderTab();break}
    case 'care':{const id=el.dataset.id;if(!S.trees[id])break;
      if(session&&session.mode==='focus'){toast('Terminá la sesión antes de cambiar de árbol');break}
      S.active=id;save();buildTree(id);toast('Ahora cuidás tu '+SPECIES[id].name);renderTab();break}
    case 'toggle':{const id=el.dataset.id;S.equipped[id]=!S.equipped[id];save();applyEquipment();renderTab();break}
    case 'usesky':S.sky=skyKey(el.dataset.id);save();applyEquipment();renderTab();break;
    case 'removesky':S.sky='day';save();applyEquipment();renderTab();toast('Volviste al cielo de día');break;
    case 'invite':{
      const text='Estudiemos juntos en Brotar. Mi código: '+S.code;
      if(navigator.share){navigator.share({title:'Brotar',text}).catch(()=>{})}
      else{try{navigator.clipboard.writeText(text);toast('Código copiado')}catch(e){toast('Tu código es '+S.code)}}
      break}
    case 'cheer':{const n=el.dataset.id;S.cheered[n]=!S.cheered[n];if(S.cheered[n]){S.sent++;toast('Le mandaste ánimo a '+n)}save();renderTab();break}
    case 'addFriend':{
      const inp=$('#friendCode');const code=(inp.value||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
      if(code.length<4){toast('Escribí el código completo de tu amigo');break}
      if(code===S.code){toast('Ese es tu propio código');break}
      const tail=code.slice(-4),keys=Object.keys(SPECIES),cols=['#e07a5f','#3d9970','#5c7cfa','#c8a23a'];
      S.friends.push({n:'Amigo '+tail,c:cols[S.friends.length%4],tree:keys[S.friends.length%keys.length],leaves:Math.floor(Math.random()*15),wk:Math.floor(Math.random()*300),st:'off',off:0,since:Date.now()});
      save();toast('Amigo agregado (simulado)');renderTab();break}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});
document.addEventListener('change',e=>{
  if(e.target.id==='durIn')setDur(e.target.value);
  else if(e.target.id==='demoCb'){S.demo=e.target.checked;save()}
  else if(e.target.id==='subjectSelect'){S.selectedSubject=e.target.value;save()}
  else if(e.target.id==='musicCb'){if(e.target.checked)startAmbient();else stopAmbient()}
  else if(e.target.dataset.task!==undefined){S.tasks[+e.target.dataset.task].done=e.target.checked;save();renderTab()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='friendCode')act('addFriend');if(e.key==='Enter'&&e.target.id==='authPassword')authLogin();if(e.key==='Escape')closeModal()});

/* ---------- inicio ---------- */
if(HAS3D){try{init3D();buildTree(S.active);applyEquipment();requestAnimationFrame(frame)}catch(err){console.warn('BROTAR 3D no disponible',err);$('#gl').style.display='none';$('#stage').insertAdjacentHTML('afterbegin','<div class="nogl">El bosque 3D no está disponible en este navegador. El temporizador y las herramientas siguen funcionando.</div>')}}
else{$('#gl').style.display='none';$('#stage').insertAdjacentHTML('afterbegin','<div class="nogl">El bosque 3D no está disponible en este navegador. El temporizador y las herramientas siguen funcionando.</div>')}
updateLabel();
$('#pts').textContent=S.points;
renderTab();
initCloud();
setInterval(tick,250);
})();
</script>

<script>
// Instalación PWA y registro del modo sin conexión
(()=>{
  const splash=document.getElementById('bootSplash');
  const hideSplash=()=>{if(splash)splash.classList.add('done')};
  window.addEventListener('load',()=>setTimeout(hideSplash,420),{once:true});
  setTimeout(hideSplash,4500);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('Brotar: no se pudo activar el modo sin conexión',err)));
  }
  const btn=document.getElementById('installBtn');
  const offlineBadge=document.getElementById('offlineBadge');
  const refreshConnection=()=>{if(offlineBadge)offlineBadge.classList.toggle('visible',!navigator.onLine)};
  refreshConnection();window.addEventListener('online',refreshConnection);window.addEventListener('offline',refreshConnection);
  let installEvent=null;
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(btn && !standalone()){
    btn.classList.add('visible');
    btn.addEventListener('click',async()=>{
      if(installEvent){installEvent.prompt();const result=await installEvent.userChoice;if(result.outcome==='accepted')btn.textContent='✓ Instalada';installEvent=null;return;}
      const ua=navigator.userAgent||'';
      if(/iphone|ipad|ipod/i.test(ua)) alert('Para instalar Brotar en iPhone: abrí esta página en Safari, tocá Compartir y elegí “Agregar a pantalla de inicio”.');
      else alert('Para instalar Brotar: abrí el menú del navegador y elegí “Instalar aplicación” o “Añadir a pantalla de inicio”.');
    });
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;if(btn){btn.classList.add('visible');btn.textContent='＋ Instalar';}});
  window.addEventListener('appinstalled',()=>{if(btn){btn.textContent='✓ Instalada';btn.classList.remove('visible');}});
})();
</script>
